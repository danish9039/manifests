{{- if eq .Values.scenario "platform" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "kubeflow-dashboard.centralDashboard.labels" . | nindent 4 }}
  name: dashboard
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kubeflow-dashboard.centralDashboard.labels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/central-dashboard-config.yaml") . | sha256sum }}
        kubectl.kubernetes.io/default-container: dashboard
      labels:
        {{- include "kubeflow-dashboard.centralDashboard.labels" . | nindent 8 }}
        sidecar.istio.io/inject: "true"
    spec:
      containers:
      - env:
        - name: PROFILES_KFAM_SERVICE_HOST
          value: profiles-kfam.{{ .Release.Namespace }}
        - name: DASHBOARD_CONFIGMAP
          value: dashboard-config
        - name: LOGOUT_URL
          value: /oauth2/sign_out
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        envFrom:
        - configMapRef:
            name: dashboard-parameters
        image: {{ include "kubeflow-dashboard.image" (dict "root" . "repository" .Values.centralDashboard.image.repository) }}
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8082
          initialDelaySeconds: 15
          periodSeconds: 30
        name: dashboard
        ports:
        - containerPort: 8082
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8082
          initialDelaySeconds: 15
          periodSeconds: 30
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
      serviceAccountName: dashboard
{{- end }}
