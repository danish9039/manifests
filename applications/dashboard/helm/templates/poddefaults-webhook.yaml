{{- if eq .Values.scenario "platform" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "kubeflow-dashboard.podDefaultsWebhook.labels" . | nindent 4 }}
  name: poddefaults-webhook-deployment
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kubeflow-dashboard.podDefaultsWebhook.labels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: poddefaults-webhook
      labels:
        {{- include "kubeflow-dashboard.podDefaultsWebhook.labels" . | nindent 8 }}
        sidecar.istio.io/inject: "false"
    spec:
      containers:
      - args:
        - --tlsCertFile=/etc/webhook/certs/tls.crt
        - --tlsKeyFile=/etc/webhook/certs/tls.key
        image: {{ include "kubeflow-dashboard.image" (dict "root" . "repository" .Values.podDefaultsWebhook.image.repository) }}
        name: poddefaults-webhook
        ports:
        - containerPort: 4443
          name: https-webhook
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /etc/webhook/certs
          name: webhook-cert
          readOnly: true
      serviceAccountName: poddefaults-webhook-service-account
      volumes:
      - name: webhook-cert
        secret:
          defaultMode: 420
          secretName: poddefaults-webhook-certs
{{- end }}
{{- /* The Kustomize baseline sets no restart trigger for this Deployment
because it consumes no generated ConfigMap, so no checksum annotation is
rendered here. */}}
