{{- if eq .Values.scenario "platform" }}
{{- $configuration := dict
  "ADMIN" (.Values.profileController.admin | toString)
  "ISTIO_INGRESS_GATEWAY_PRINCIPAL" (.Values.profileController.istioIngressGatewayPrincipal | toString)
  "KFP_UI_PRINCIPAL" (.Values.profileController.kfpUiPrincipal | toString)
  "NOTEBOOK_CONTROLLER_PRINCIPAL" (.Values.profileController.notebookControllerPrincipal | toString)
  "USERID_HEADER" (.Values.identity.userIdHeader | toString)
  "USERID_PREFIX" (.Values.identity.userIdPrefix | toString)
  "WORKLOAD_IDENTITY" (.Values.profileController.workloadIdentity | toString) }}
{{- $namespaceLabels := dict
  "namespace-labels.yaml" (include "kubeflow-dashboard.document" (dict "root" . "path" "manifests/documents/profile-namespace-labels.yaml" "value" .Values.profileController.namespaceLabels "name" "profileController.namespaceLabels")) }}
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    {{- include "kubeflow-dashboard.profileController.labels" . | nindent 4 }}
  name: profiles-config
  namespace: {{ .Release.Namespace }}
data:
  {{- toYaml $configuration | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    {{- include "kubeflow-dashboard.profileController.labels" . | nindent 4 }}
  name: profiles-namespace-labels-data
  namespace: {{ .Release.Namespace }}
data:
  {{- toYaml $namespaceLabels | nindent 2 }}
{{- end }}
