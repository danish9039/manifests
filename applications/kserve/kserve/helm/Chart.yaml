apiVersion: v2
name: kserve
description: A Helm chart for the KServe platform resources of the Kubeflow Community Distribution
version: 0.1.0
appVersion: "v0.20.0"
keywords:
- kubeflow
- kserve
- serving
home: https://github.com/kubeflow/community-distribution
sources:
- https://github.com/kubeflow/community-distribution/tree/master/applications/kserve/kserve
- https://github.com/kserve/kserve
annotations:
  category: Serving
  licenses: Apache-2.0
# The generated payload is an unpacked chart under charts/kserve-payload, so the
# dependency names no repository and needs neither Chart.lock nor an archive.
# Helm stores the files of the installed chart in the release record but not
# the files of its dependencies, which keeps the record below the 1 MiB limit
# of a Kubernetes Secret.
dependencies:
- name: kserve-payload
  version: 0.1.0
  alias: payload
