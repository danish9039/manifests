name: Helm vs Kustomize Comparison

# The comparison covers every chart the repository ships, and a chart's Kustomize
# baseline can be any manifests directory, so this filter is deliberately broad.
# A narrower, hand-maintained list is indistinguishable from a complete one when
# it is wrong: applications/katib was missing from the previous filter, so a
# Katib upstream synchronization changed all seven Katib baselines without ever
# running a comparison.
on:
  pull_request:
    paths:
    - common/**
    - applications/**
    - experimental/**
    - scripts/**
    - tests/**
    - .github/workflows/helm-kustomize-comparison.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  discover-components:
    runs-on: ubuntu-latest
    name: Discover comparison components
    outputs:
      components: ${{ steps.discover.outputs.components }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - name: Install Python dependencies
      run: python -m pip install pyyaml
    # Validating descriptors here fails the workflow in seconds rather than once
    # per matrix job, and a malformed descriptor would break discovery anyway.
    - name: Test comparison descriptors
      run: python tests/test_comparison_descriptors.py
    - name: Test comparison normalization
      run: |
        python tests/test_helm_kustomize_compare.py
        python -m unittest tests/test_helm_kustomize_compare.py
    - name: Discover components
      id: discover
      run: |
        components=$(python3 tests/run_helm_kustomize_comparison.py --list --json)
        echo "components=${components}" >> "$GITHUB_OUTPUT"
        echo "Discovered: ${components}"

  compare:
    needs: discover-components
    runs-on: ubuntu-latest
    name: Compare ${{ matrix.component }}
    strategy:
      # Every component reports its own verdict; one failure must not hide the
      # others, because a shared change usually breaks several at once.
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.discover-components.outputs.components) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - name: Install Python dependencies
      run: python -m pip install pyyaml
    - name: Install Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      with:
        version: v4.2.2
    - name: Install Kustomize
      run: |
        ./tests/kustomize_install.sh
        echo "/tmp/usr/local/bin" >> "$GITHUB_PATH"
    - name: Compare Helm and Kustomize manifests
      run: python3 tests/run_helm_kustomize_comparison.py "${{ matrix.component }}" --all-scenarios

  chart-behavior-tests:
    runs-on: ubuntu-latest
    name: Test chart behavior
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - name: Install Python dependencies
      run: python -m pip install pyyaml ruamel.yaml==0.19.1
    - name: Install Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      with:
        version: v4.2.2
    - name: Install Kustomize
      run: |
        ./tests/kustomize_install.sh
        echo "/tmp/usr/local/bin" >> "$GITHUB_PATH"
    - name: Test Dex Helm behavior
      run: python tests/test_dex_helm_rollout_checksums.py
    - name: Test Istio Helm behavior
      run: python tests/test_istio_helm_chart.py
    - name: Test Dashboard Helm behavior
      run: python tests/test_dashboard_helm_chart.py
    - name: Test Notebooks Helm behavior
      run: python tests/test_notebooks_helm_chart.py
    - name: Test Dashboard manifest generation
      run: |
        python tests/test_helm_manifest_generator.py
        python tests/test_dashboard_helm_manifest_generator.py
