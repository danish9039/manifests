# Declares how this chart is compared against its Kustomize baseline.
# The harness discovers this file; no shared list needs editing.
component: istio
releaseName: istio
namespace: istio-system
includeCustomResourceDefinitions: true
defaultScenario: base
scenarios:
  base:
    kustomize:
    - common/istio/istio-crds/base
    - common/istio/istio-namespace/base
    - common/istio/istio-install/base
    values: ci/values-base.yaml
  cluster-local-gateway:
    kustomize:
    - common/istio/cluster-local-gateway/base
    values: ci/values-cluster-local-gateway.yaml
  crds:
    kustomize:
    - common/istio/istio-crds/base
    values: ci/values-crds.yaml
  gke:
    kustomize:
    - common/istio/istio-crds/base
    - common/istio/istio-namespace/base
    - common/istio/istio-install/overlays/gke
    values: ci/values-gke.yaml
  kubeflow-istio-resources:
    kustomize:
    - common/istio/kubeflow-istio-resources/base
    values: ci/values-kubeflow-istio-resources.yaml
  oauth2-proxy:
    kustomize:
    - common/istio/istio-crds/base
    - common/istio/istio-namespace/base
    - common/istio/istio-install/overlays/oauth2-proxy
    values: ci/values-oauth2-proxy.yaml
  platform-full:
    kustomize:
    - common/istio/istio-crds/base
    - common/istio/istio-namespace/base
    - common/istio/istio-install/overlays/oauth2-proxy
    - common/istio/cluster-local-gateway/base
    - common/istio/kubeflow-istio-resources/base
    values: ci/values-platform-full.yaml
