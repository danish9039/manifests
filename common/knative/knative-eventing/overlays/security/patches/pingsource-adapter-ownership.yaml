# The PingSource controller configures and scales this shared adapter.
# Leave its runtime fields out of both installation paths. Kubernetes defaults
# replicas to one, so the adapter starts before the first PingSource exists.
- op: test
  path: /spec/replicas
  value: 0
- op: remove
  path: /spec/replicas
- op: test
  path: /spec/template/spec/containers/0/name
  value: dispatcher
- op: test
  path: /spec/template/spec/containers/0/env/7/name
  value: POD_NAME
- op: remove
  path: /spec/template/spec/containers/0/env/7
- op: test
  path: /spec/template/spec/containers/0/env/6/name
  value: K_SINK_TIMEOUT
- op: remove
  path: /spec/template/spec/containers/0/env/6
- op: test
  path: /spec/template/spec/containers/0/env/5/name
  value: K_NO_SHUTDOWN_AFTER
- op: remove
  path: /spec/template/spec/containers/0/env/5
- op: test
  path: /spec/template/spec/containers/0/env/4/name
  value: K_LEADER_ELECTION_CONFIG
- op: remove
  path: /spec/template/spec/containers/0/env/4
- op: test
  path: /spec/template/spec/containers/0/env/3/name
  value: K_LOGGING_CONFIG
- op: remove
  path: /spec/template/spec/containers/0/env/3
- op: test
  path: /spec/template/spec/containers/0/env/2/name
  value: K_OBSERVABILITY_CONFIG
- op: remove
  path: /spec/template/spec/containers/0/env/2
- op: test
  path: /spec/template/spec/containers/0/env/0/name
  value: SYSTEM_NAMESPACE
- op: test
  path: /spec/template/spec/containers/0/env/1/name
  value: NAMESPACE
- op: move
  from: /spec/template/spec/containers/0/env/1
  path: /spec/template/spec/containers/0/env/0
