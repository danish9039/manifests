component: knative-serving
releaseName: knative-serving
namespace: kubeflow
includeCustomResourceDefinitions: false
knownDifferences:
- resource: MutatingWebhookConfiguration/webhook.serving.knative.dev
  controllerOwnedWebhookRules:
  - webhook.serving.knative.dev
  reason: Knative populates admission rules from its registered handlers; Helm
    omits only this controller-owned field. Installation verifies admission before
    creating consumers. All other webhook fields remain compared.
- resource: ValidatingWebhookConfiguration/validation.webhook.serving.knative.dev
  controllerOwnedWebhookRules:
  - validation.webhook.serving.knative.dev
  reason: Knative populates admission rules from its registered handlers; Helm
    omits only this controller-owned field. Installation verifies admission before
    creating consumers. All other webhook fields remain compared.
retainedCustomResourceDefinitions:
  reason: Retain the Serving APIs and user resources when the controller release is
    removed.
  names:
  - certificates.networking.internal.knative.dev
  - clusterdomainclaims.networking.internal.knative.dev
  - configurations.serving.knative.dev
  - domainmappings.serving.knative.dev
  - images.caching.internal.knative.dev
  - ingresses.networking.internal.knative.dev
  - metrics.autoscaling.internal.knative.dev
  - podautoscalers.autoscaling.internal.knative.dev
  - revisions.serving.knative.dev
  - routes.serving.knative.dev
  - serverlessservices.networking.internal.knative.dev
  - services.serving.knative.dev
scenarios:
  platform:
    kustomize:
    - common/knative/knative-serving/overlays/gateways
    values: ci/values-platform.yaml
