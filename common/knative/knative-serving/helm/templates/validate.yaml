{{- if ne .Release.Namespace "kubeflow" -}}
{{- fail "Knative Serving release records must be installed into the kubeflow namespace" -}}
{{- end -}}
{{- if ne .Values.scenario "platform" -}}
{{- fail "only the platform scenario is supported" -}}
{{- end -}}
{{- if not (has .Values.installation.phase (list "definitions" "controllers" "complete")) -}}
{{- fail "installation.phase must be definitions, controllers, or complete" -}}
{{- end -}}
