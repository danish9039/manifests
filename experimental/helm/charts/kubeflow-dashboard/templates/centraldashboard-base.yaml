kind: ConfigMap
metadata:
  labels:
    app: kubeflow-dashboard
    app.kubernetes.io/component: dashboard
  name: dashboard-config
  namespace: kubeflow
---
apiVersion: v1
data:
  COLLECT_METRICS: "true"
  REGISTRATION_FLOW: "false"
  USERID_HEADER: kubeflow-userid
  USERID_PREFIX: ""
kind: ConfigMap
metadata:
  labels:
    app: kubeflow-dashboard
    app.kubernetes.io/component: dashboard
  name: dashboard-parameters-ckkh684h89
  namespace: kubeflow
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: kubeflow-dashboard
    app.kubernetes.io/component: dashboard
  name: dashboard
  namespace: kubeflow
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 8082
  selector:
    app: kubeflow-dashboard
    app.kubernetes.io/component: dashboard
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: kubeflow-dashboard
    app.kubernetes.io/component: dashboard
  name: dashboard
  namespace: kubeflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeflow-dashboard
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: dashboard
      labels:
        app: kubeflow-dashboard
        app.kubernetes.io/component: dashboard
    spec:
      containers:
      - env:
        - name: PROFILES_KFAM_SERVICE_HOST
          value: profiles-kfam.kubeflow
        - name: DASHBOARD_CONFIGMAP
          value: dashboard-config
        - name: LOGOUT_URL
          value: /oauth2/sign_out
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        envFrom:
        - configMapRef:
            name: dashboard-parameters-ckkh684h89
        image: ghcr.io/kubeflow/dashboard/dashboard:v2.0.0-rc.1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8082
          initialDelaySeconds: 15
          periodSeconds: 30
        name: dashboard
        ports:
        - containerPort: 8082
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8082
          initialDelaySeconds: 15
          periodSeconds: 30
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
      serviceAccountName: dashboard

{{- end }}
