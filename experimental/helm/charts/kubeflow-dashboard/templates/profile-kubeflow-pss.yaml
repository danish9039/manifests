  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app: profile-controller
        app.kubernetes.io/component: controller-manager
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/name: profile-controller
        app.kubernetes.io/part-of: kubeflow-dashboard
        sidecar.istio.io/inject: "true"
    spec:
      containers:
      - command:
        - /access-management
        - -cluster-admin
        - $(ADMIN)
        - -userid-header
        - $(USERID_HEADER)
        - -userid-prefix
        - $(USERID_PREFIX)
        envFrom:
        - configMapRef:
            name: profiles-config-5h9m86f79f
        image: ghcr.io/kubeflow/dashboard/access-management:v2.0.0-rc.1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /metrics
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 30
        name: access-management
        ports:
        - containerPort: 8081
          name: http-kfam
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /metrics
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 30
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      - args:
        - --leader-elect
        - --health-probe-bind-address=:9876
        - --metrics-bind-address=0
        command:
        - /manager
        - -userid-header
        - $(USERID_HEADER)
        - -userid-prefix
        - $(USERID_PREFIX)
        - -workload-identity
        - $(WORKLOAD_IDENTITY)
        envFrom:
        - configMapRef:
            name: profiles-config-5h9m86f79f
        image: ghcr.io/kubeflow/dashboard/profile-controller:v2.0.0-rc.1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9876
          initialDelaySeconds: 15
          periodSeconds: 30
        name: manager
        ports:
        - containerPort: 9876
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9876
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /etc/profile-controller
          name: namespace-labels
          readOnly: true
      serviceAccountName: profiles-controller-service-account
      volumes:
      - configMap:
          name: profiles-namespace-labels-data-7ht8c9hf25
        name: namespace-labels
