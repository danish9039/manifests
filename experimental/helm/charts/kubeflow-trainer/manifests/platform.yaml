apiVersion: trainer.kubeflow.org/v1alpha1
kind: ClusterTrainingRuntime
metadata:
  labels:
    trainer.kubeflow.org/framework: torchtune
  name: torchtune-llama3.2-1b
  namespace: kubeflow-system
spec:
  mlPolicy:
    numNodes: 1
    torch: {}
  template:
    spec:
      replicatedJobs:
      - name: dataset-initializer
        template:
          metadata:
            labels:
              trainer.kubeflow.org/trainjob-ancestor-step: dataset-initializer
          spec:
            template:
              spec:
                containers:
                - env:
                  - name: STORAGE_URI
                    value: hf://tatsu-lab/alpaca
                  image: ghcr.io/kubeflow/trainer/dataset-initializer:v2.2.0
                  name: dataset-initializer
                  volumeMounts:
                  - mountPath: /workspace
                    name: initializer
      - name: model-initializer
        template:
          metadata:
            labels:
              trainer.kubeflow.org/trainjob-ancestor-step: model-initializer
          spec:
            template:
              spec:
                containers:
                - env:
                  - name: STORAGE_URI
                    value: hf://meta-llama/Llama-3.2-1B-Instruct
                  image: ghcr.io/kubeflow/trainer/model-initializer:v2.2.0
                  name: model-initializer
                  volumeMounts:
                  - mountPath: /workspace
                    name: initializer
      - dependsOn:
        - name: dataset-initializer
          status: Complete
        - name: model-initializer
          status: Complete
        name: node
        template:
          metadata:
            labels:
              trainer.kubeflow.org/trainjob-ancestor-step: trainer
          spec:
            template:
              spec:
                containers:
                - command:
                  - tune
                  - run
                  - --rdzv_endpoint=localhost:29500
                  - full_finetune_distributed
                  - --config
                  - llama3_2/1B_full
                  - dataset=torchtune.datasets.instruct_dataset
                  - dataset.source=parquet
                  - dataset.data_dir=/workspace/dataset/data
                  - output_dir=/workspace/output
                  - tokenizer.path=/workspace/model/original/tokenizer.model
                  - checkpointer.checkpoint_dir=/workspace/model
                  image: ghcr.io/kubeflow/trainer/torchtune-trainer:v2.2.0
                  name: node
                  resources:
                    limits:
                      nvidia.com/gpu: 2
                  volumeMounts:
                  - mountPath: /workspace
                    name: initializer
      volumeClaimPolicies:
      - templates:
        - metadata:
            name: initializer
          spec:
            accessModes:
            - ReadWriteOnce
            resources:
              requests:
                storage: 20Gi
