        publishNotReadyAddresses: true
      replicatedJobs:
      - name: launcher
        template:
          metadata:
            labels:
              trainer.kubeflow.org/trainjob-ancestor-step: trainer
          spec:
            template:
              spec:
                containers:
                - image: ghcr.io/kubeflow/trainer/mlx-runtime:v2.2.0
                  name: node
                  securityContext:
                    runAsUser: 1000
      - name: node
        template:
          spec:
            template:
              spec:
                containers:
                - args:
                  - -De
                  - -f
                  - /home/mpiuser/.sshd_config
                  command:
                  - /usr/sbin/sshd
                  image: ghcr.io/kubeflow/trainer/mlx-runtime:v2.2.0
                  name: node
                  readinessProbe:
                    initialDelaySeconds: 5
                    tcpSocket:
                      port: 2222
                  securityContext:
                    runAsUser: 1000
      successPolicy:
        operator: All
        targetReplicatedJobs:
        - launcher
