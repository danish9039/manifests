apiVersion: v1
data:
  controller_manager_config.yaml: "apiVersion: config.trainer.kubeflow.org/v1alpha1\n\
    kind: Configuration\n# Health configuration\nhealth:\n  healthProbeBindAddress:\
    \ :8081\n  readinessEndpointName: readyz\n  livenessEndpointName: healthz\n\n\
    # Metrics configuration\nmetrics:\n  bindAddress: :8443\n  secureServing: true\n\
    \n# Webhook configuration\nwebhook:\n  port: 9443\n  host: \"\"\n\n# Leader election\
    \ configuration\nleaderElection:\n  leaderElect: true\n  resourceName: trainer.kubeflow.org\n\
    \  resourceNamespace: \"\"\n  leaseDuration: 15s\n  renewDeadline: 10s\n  retryPeriod:\
    \ 2s\n\n# Controller configuration\ncontroller:\n  groupKindConcurrency:\n   \
    \ TrainJob.trainer.kubeflow.org: 5\n    TrainingRuntime.trainer.kubeflow.org:\
    \ 1\n    ClusterTrainingRuntime.trainer.kubeflow.org: 1\n\n# Certificate management\
    \ configuration\ncertManagement:\n  enable: true\n  webhookServiceName: kubeflow-trainer-controller-manager\n\
    \  webhookSecretName: kubeflow-trainer-webhook-cert\n\n# Client connection configuration\n\
    clientConnection:\n  qps: 50\n  burst: 100\n\nstatusServer:\n  port: 10443\n \
    \ qps: 5\n  burst: 10\n"
kind: ConfigMap
metadata:
  name: kubeflow-trainer-config
  namespace: kubeflow-system
