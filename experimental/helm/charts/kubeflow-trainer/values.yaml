# Default values for the Kubeflow Trainer wrapper chart.
#
# Trainer and JobSet CRDs live under the chart crds/ directory. Install the
# chart first with the CRD-only values, then upgrade with the platform values
# after the CRDs are available to the API server.

# -- Installation mode. The first chart slice supports platform mode only.
installationMode: platform

# -- Install stage. Use crds first, then upgrade with platform.
installStage: crds

global:
  # -- Namespace for Kubeflow Trainer and JobSet controller workloads.
  systemNamespace: kubeflow-system
