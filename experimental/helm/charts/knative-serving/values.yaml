# Default values for the Kubeflow Knative Serving wrapper chart.
#
# Knative Serving CRDs live under the chart crds/ directory. Install the chart
# first with the CRD-only values, then upgrade with the full platform values
# after the CRDs are available to the API server.

# -- Installation mode. The first chart slice supports platform mode only.
installationMode: platform

# -- Install stage. Use crds first, then upgrade with full.
installStage: crds

global:
  # -- Namespace for Knative Serving workloads.
  knativeServingNamespace: knative-serving
  # -- Namespace for Istio gateway resources referenced by Knative net-istio.
  istioNamespace: istio-system
  # -- Namespace containing the Kubeflow gateway.
  kubeflowNamespace: kubeflow
